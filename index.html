<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neka Downloader - Premium Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8e44ad;
            --secondary: #3498db;
            --accent: #e74c3c;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0f0c29;
            background-image: url('img/bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            overflow: hidden;
        }

        .container {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            font-weight: 600;
            font-size: 32px;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.2);
            background: rgba(0, 0, 0, 0.4);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        button {
            padding: 16px 32px;
            background: rgb(216, 60, 60);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px -10px rgba(142, 68, 173, 0.5);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -10px rgba(142, 68, 173, 0.6);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #progressContainer {
            display: none;
            margin-top: 30px;
            text-align: left;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 12px;
            position: relative;
        }

        #progressFill {
            height: 100%;
            background: linear-gradient(90deg, #6c5ce7, #00d2ff);
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }

        #progressText {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
            display: flex;
            justify-content: space-between;
        }

        #percentage {
            font-weight: 600;
            color: var(--secondary);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Tải Neka</h2>

        <div class="input-group">
            <div class="input-wrapper">
                <input id="kitId" placeholder="Nhập ID Neka (VD: 12345)" />
            </div>
            <div class="input-wrapper">
                <input id="savePath" placeholder="Đường dẫn lưu (để trống: downloads/)" />
            </div>
            <button id="downloadBtn" onclick="download()">Bắt đầu tải xuống</button>
        </div>

        <div id="progressContainer">
            <div class="progress-bar-bg">
                <div id="progressFill"></div>
            </div>
            <div id="progressText">
                <span id="statusLabel">Đang khởi tạo...</span>
                <span id="percentage">0%</span>
            </div>
        </div>
    </div>

    <script>
        let progressInterval = null;

        async function checkProgress(id) {
            try {
                const res = await fetch('/api/check_progress', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                const data = await res.json();

                if (data.success && data.progress) {
                    const { percentage, message } = data.progress;
                    document.getElementById('progressFill').style.width = percentage + '%';
                    document.getElementById('percentage').textContent = percentage + '%';
                    document.getElementById('statusLabel').textContent = message || 'Đang xử lý...';
                }
            } catch (e) {
                console.log('Progress check error:', e);
            }
        }

        async function download() {
            const id = document.getElementById('kitId').value.trim();
            const path = document.getElementById('savePath').value.trim();
            if (!id) return alert("Vui lòng nhập ID Neka!");

            // UI Reset
            const btn = document.getElementById('downloadBtn');
            btn.disabled = true;
            btn.textContent = 'Đang thực hiện...';
            document.getElementById('progressContainer').style.display = 'block';
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('percentage').textContent = '0%';
            document.getElementById('statusLabel').textContent = 'Đang khởi tạo kết nối...';

            // Polling
            progressInterval = setInterval(() => checkProgress(id), 2000);

            try {
                const res = await fetch('/api/download_kit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, path })
                });

                clearInterval(progressInterval);

                if (res.ok) {
                    document.getElementById('progressFill').style.width = '100%';
                    document.getElementById('percentage').textContent = '100%';
                    document.getElementById('statusLabel').textContent = 'Tải về hoàn tất!';

                    const blob = await res.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `neka_${id}.zip`;
                    a.click();
                    URL.revokeObjectURL(url);

                    setTimeout(() => {
                        document.getElementById('progressContainer').style.display = 'none';
                        btn.disabled = false;
                        btn.textContent = 'Bắt đầu tải xuống';
                    }, 3000);
                } else {
                    const err = await res.json();
                    alert("Lỗi: " + (err.message || "Không thể tải kit"));
                    resetUI();
                }
            } catch (error) {
                clearInterval(progressInterval);
                alert("Lỗi kết nối: " + error.message);
                resetUI();
            }
        }

        function resetUI() {
            const btn = document.getElementById('downloadBtn');
            btn.disabled = false;
            btn.textContent = 'Bắt đầu tải xuống';
            document.getElementById('progressContainer').style.display = 'none';
        }
    </script>
</body>

</html>
